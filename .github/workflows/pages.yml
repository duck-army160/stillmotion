name: Publish Stillmotion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the site files
        shell: bash
        run: |
          for file in index.html style.css sample.jpg app.js caption.js gif.js montage.js motion.js theme.js \
            fonts/comic-neue.ttf fonts/fredoka-one.woff2 fonts/lexend-black.woff2 fonts/titan-one.woff2; do
            test -s "site/$file"
          done
          for script in site/*.js; do
            node --input-type=module --check < "$script"
          done
      - name: Upload the static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
